[project]
name = "wiki-iwe"
version = "0.1.0"
description = "Wiki statique de révision DU Ingénierie du soudage / IWE"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3,<10"]
browser = ["playwright>=1.50,<2"]
carte = ["numpy>=2,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
norecursedirs = ["browser", ".venv", "_site"]
