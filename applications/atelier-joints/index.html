<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Atelier des joints · Révisions IWE</title>
  <meta name="description" content="Entraînement à la lecture et à l’écriture des symboles de soudage (ISO 2553) et des tolérances générales (ISO 13920) : cinq niveaux, révision espacée des erreurs, examen blanc.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=STIX+Two+Text:ital@0;1&display=swap">
  <link rel="stylesheet" href="assets/style.css">
  <script>try { var t = localStorage.getItem('atelier-joints-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <script defer src="js/coupe.js"></script>
  <script defer src="js/symbole.js"></script>
  <script defer src="js/generateur.js"></script>
  <script defer src="js/progression.js"></script>
  <script defer src="js/leitner.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="evitement" href="#contenu">Aller au contenu</a>
  <header class="barre">
    <a class="marque" href="#parcours" aria-label="Atelier des joints, parcours">
      <svg class="logo" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M3 27 12 18"/><path d="M12 18h17"/><path d="M12 22h17" stroke-dasharray="3 2.4"/><path d="M18 11l3.5 7 3.5-7"/></svg>
      <span class="marque-texte"><strong>Atelier des joints</strong><small>Symboles de soudage · IWE</small></span>
    </a>
    <nav class="nav" aria-label="Navigation de l’atelier">
      <a href="#parcours" data-route="parcours">Parcours</a>
      <a href="#revision" data-route="revision">Révision <span class="pastille" id="pastille" hidden></span></a>
      <a href="#examen" data-route="examen">Examen</a>
      <a href="#aide" data-route="aide">Aide</a>
    </nav>
    <button type="button" class="bouton-icone" id="bouton-theme" title="Changer de thème">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <span class="sr">Changer de thème</span>
    </button>
  </header>
  <div class="avis" id="avis-stockage" role="status" hidden>Le stockage du navigateur est indisponible : ta progression ne sera pas enregistrée.</div>
  <main id="contenu" tabindex="-1"></main>
  <div class="sr" id="annonce" aria-live="polite"></div>
  <noscript><p class="avis">Active JavaScript pour t’entraîner. Tout reste sur cet appareil : pas de compte, pas d’envoi de données.</p></noscript>
</body>
</html>
