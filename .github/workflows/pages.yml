name: Vérifier et publier le wiki

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - name: Installer uv et Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.18"
      - name: Installer la version Python du projet
        run: uv python install
      - name: Installer les dépendances verrouillées
        run: uv sync --locked --group browser --group carte
      - name: Tester le catalogue et la génération
        run: uv run pytest
      - name: Installer Node pour les moteurs des applications (sans npm)
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Tester les moteurs des applications
        run: node --test applications/*/tests/*.test.cjs
      - name: Tester le cœur de l’assistant de révision
        run: node --test tests/js/*.test.cjs
      - name: Installer Chromium
        run: uv run --group browser playwright install --with-deps chromium
      - name: Tester les parcours navigateur
        run: uv run --group browser pytest tests/browser
      - name: Tester les applications dans le navigateur
        run: uv run --group browser --group carte pytest applications
      - name: Construire et vérifier tous les liens
        run: uv run python -m wiki build
      - name: Préparer GitHub Pages
        if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/configure-pages@v5
      - name: Transmettre uniquement le site généré
        if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
